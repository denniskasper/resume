name: Build and Release Resume PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Build PDF
        run: npm run build

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Resume
          body: |
            Automatically built resume PDF.
            Last updated: ${{ steps.date.outputs.date }}
          files: dennis_kasper_resume.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # denniskasper.com (Dokploy) auto-deploys on push to its repo. Pushing an
      # empty commit there triggers a redeploy, which re-fetches this resume.
      - name: Trigger denniskasper.com redeploy
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${SITE_DEPLOY_TOKEN}@github.com/denniskasper/denniskasper.com.git" site
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: redeploy for resume update ${{ steps.date.outputs.date }}"
          git push origin HEAD:main
