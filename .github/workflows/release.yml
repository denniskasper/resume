name: Build and Release Resume PDF

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Build PDF
        run: |
          export PUPPETEER_EXECUTABLE_PATH="$(which google-chrome || which chromium-browser)"
          echo "Using Chrome at: $PUPPETEER_EXECUTABLE_PATH"
          npm run build

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest Resume
          body: |
            Automatically built resume PDF.
            Last updated: ${{ steps.date.outputs.date }}
          files: dennis_kasper_resume.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # denniskasper.com is a Cloudflare Worker whose build fetches this repo's
      # markdown and latest release PDF, so a release here needs a rebuild there.
      # The Deploy Hook triggers one directly; Cloudflare deduplicates concurrent
      # requests for the same branch.
      - name: Trigger denniskasper.com rebuild
        env:
          DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK_URL}" ]; then
            echo "SITE_DEPLOY_HOOK_URL is not set" >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error -X POST "${DEPLOY_HOOK_URL}"
